<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Message</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .message-container {
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 300px;
      background-color: #ffffff;
    }
    .message-container p {
      font-size: 16px;
      margin: 15px 0;
    }
    .not-found {
      color: #f44336;
      font-weight: bold;
      background-color: #ffebee;
      border: 1px solid #f44336;
      padding: 15px;
      border-radius: 6px;
    }
    .in-progress {
      color: #ff9800;
      font-weight: bold;
      background-color: #fff3e0;
      border: 1px solid #ff9800;
      padding: 15px;
      border-radius: 6px;
    }
    .unknown-status {
      color: #2196f3;
      font-weight: bold;
      background-color: #e3f2fd;
      border: 1px solid #2196f3;
      padding: 15px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="message-container">
    {% if status == 'NOT_FOUND' %}
      <p class="not-found">The site with id {{ site_id }} is not found.</p>
    {% elif status == 'IN_PROGRESS' %}
      <p class="in-progress">The site {{ site_id }} will be ready soon!</p>
    {% else %}
      <p class="unknown-status">Unknown status.</p>
    {% endif %}
  </div>
</body>
</html>
